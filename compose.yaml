services:
  api:
    build: .
    platform: linux/amd64
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      ORT_INTRA_THREADS: "2"
      CORS_ORIGINS: "http://127.0.0.2:5500,http://127.0.0.2:5501,http://127.0.0.1:5501,http://localhost:5501"
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
